<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hive hero: render scene</title>
<!--
  Full-screen hero scene, 1920×1080. window.render(t) draws the state for t in 0..1.
  render.mjs screenshots it frame by frame; encode.sh turns the frames into the scrub clip.
  The graph's top edge sits on the vertical centre line (y = 540) and the graph is centred on
  x = 960, because HeroScrub lays the text out against the centre of the cover-fitted video.
  ?bare=1 hides the waves and grid (used for the static-mode stills).
-->
<style>
  @font-face { font-family:"Fraunces"; src:url(assets/fraunces.woff2) format("woff2"); font-weight:100 900; }
  @font-face { font-family:"JetBrains Mono"; src:url(assets/jbmono-400.woff2) format("woff2"); font-weight:400; }
  @font-face { font-family:"JetBrains Mono"; src:url(assets/jbmono-500.woff2) format("woff2"); font-weight:500; }
  :root{
    --paper:#F4F2EC; --paper-2:#ECE9E1; --ink:#171512; --ink-3:#6B665B;
    --clay:#B7B0A0; --amber-strong:#A86E00;
  }
  html,body{ margin:0; background:var(--paper); }
  #scene{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--paper); }
  #scene > svg, #cam > svg{ position:absolute; inset:0; }
  #cam{ position:absolute; inset:0; transform-origin:960px 690px; }
  .label{ position:absolute; white-space:nowrap; }
  .name{ font:400 28.5px/34.5px "Fraunces"; font-variation-settings:"WONK" 1, "SOFT" 0; color:var(--ink); }
  .mono{ font:400 21px/27px "JetBrains Mono"; color:var(--ink-3); }
  .icon{ position:absolute; width:33px; height:33px; }
  #tag{ position:absolute; left:960px; top:654px; transform-origin:50% 0;
        display:flex; align-items:center; gap:12px; padding:7px 15px;
        background:var(--paper-2); border:1.5px solid var(--amber-strong); border-radius:9px;
        font:500 21px/27px "JetBrains Mono"; color:var(--ink); white-space:nowrap; }
  #tag .tick{ color:var(--amber-strong); }
  .bare #waves, .bare #grid{ display:none; }
</style>
</head>
<body>
<div id="scene">
  <!-- waves: the page's wave colours as three layers hanging from the top, so they can sway with the scroll -->
  <svg id="waves" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <path id="waveA" fill="#EFEDE6"/>
    <path id="waveB" fill="#E6E2D7" opacity=".45"/>
    <path id="waveC" fill="#E6E2D7" opacity=".9"/>
  </svg>

  <!-- canvas dot grid, fading out toward the top where the headline sits -->
  <svg id="grid" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
        <circle cx="20" cy="20" r="1.6" fill="#B7B0A0"/>
      </pattern>
      <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/>
        <stop offset=".34" stop-color="#fff" stop-opacity=".12"/>
        <stop offset=".56" stop-color="#fff" stop-opacity=".75"/>
        <stop offset=".9" stop-color="#fff" stop-opacity=".75"/>
        <stop offset="1" stop-color="#fff" stop-opacity=".2"/>
      </linearGradient>
      <mask id="gridMask"><rect width="1920" height="1080" fill="url(#fade)"/></mask>
    </defs>
    <g mask="url(#gridMask)"><rect id="gridRect" x="-80" y="-80" width="2080" height="1240" fill="url(#dots)"/></g>
  </svg>

  <div id="cam">
    <svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <!-- Claude node (node ×1.5: 228×96, 2.25 ink stroke inside, 4.5px amber-strong bar) -->
      <rect x="586.1" y="541.1" width="225.8" height="93.8" fill="#F4F2EC" stroke="#171512" stroke-width="2.25"/>
      <rect x="585" y="540" width="4.5" height="96" fill="#A86E00"/>
      <!-- GPT node -->
      <rect id="gptBox" x="1108.1" y="541.1" width="225.8" height="93.8" fill="#F4F2EC" stroke="#171512" stroke-width="2.25"/>
      <rect x="1107" y="540" width="4.5" height="96" fill="#A86E00"/>
      <!-- Therapy Bot (isolated: paper-2 fill, dashed clay) — never changes -->
      <rect x="586" y="731" width="252" height="94" fill="#ECE9E1" stroke="#B7B0A0" stroke-width="2" stroke-dasharray="6 6"/>

      <!-- edge: dashed (unsigned) underlay, then solid (signed) overlay drawn left→right -->
      <line id="edgeDash" x1="822" y1="588" x2="1083" y2="588" stroke="#6B665B" stroke-width="2.25" stroke-dasharray="7.5 7.5"/>
      <line id="edgeSolid" x1="822" y1="588" x2="822" y2="588" stroke="#171512" stroke-width="3"/>
      <path id="arrow" d="M1086 581.2 L1098 588 L1086 594.8 Z" fill="#6B665B"/>

      <!-- "signed" ripple and the leader from edge to tag -->
      <circle id="ripple" cx="960" cy="588" r="0" fill="none" stroke="#A86E00" stroke-width="2" opacity="0"/>
      <line id="leader" x1="960" y1="594" x2="960" y2="654" stroke="#A86E00" stroke-width="1.5" opacity="0"/>

      <!-- two pulses -->
      <circle id="glow1" cx="822" cy="588" r="19" fill="#A86E00" opacity="0"/>
      <circle id="dot1"  cx="822" cy="588" r="9"  fill="#A86E00" opacity="0"/>
      <circle id="glow2" cx="822" cy="588" r="19" fill="#A86E00" opacity="0"/>
      <circle id="dot2"  cx="822" cy="588" r="9"  fill="#A86E00" opacity="0"/>
    </svg>

    <img class="icon" src="assets/claude.png" style="left:629px; top:571.5px" alt="">
    <div class="label name" style="left:679px; top:570.5px">Claude</div>

    <img class="icon" src="assets/gpt.png" style="left:1151px; top:571.5px" alt="">
    <div class="label name" style="left:1201px; top:570.5px">GPT</div>

    <div class="label name" style="left:614px; top:744px; color:var(--ink-3)">Therapy Bot</div>
    <div class="label mono" style="left:614px; top:783px">no edge, no read</div>

    <div id="tag">work&nbsp;&nbsp;·&nbsp;&nbsp;30d&nbsp;&nbsp;·&nbsp;&nbsp;signed <span class="tick">✓</span></div>
  </div>
</div>

<script>
  // ---- helpers -----------------------------------------------------------
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);        // 0..1 inside [a,b]
  const mix = (a, b, k) => a + (b - a) * k;
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mixColor = (a, b, k) => {
    const A = hex(a), B = hex(b);
    return "#" + A.map((v, i) => Math.round(mix(v, B[i], k)).toString(16).padStart(2, "0")).join("");
  };

  const $ = id => document.getElementById(id);
  const X0 = 822, X1 = 1083, TIP = 1098;
  const TAU = Math.PI * 2;
  const W = 1920 / 1440, H = 1.2;       // the page's waves are 1440 wide; here they are stretched and 20% taller

  // Three wave layers, each filled from the top edge down to a curve whose control points sway as t moves.
  function waves(t) {
    const sway = (amp, speed, phase) => amp * Math.sin(TAU * (t * speed + phase));
    const x = v => (v * W).toFixed(1), y = v => (v * H).toFixed(1);
    const a = [300, 180, 150, 210, 270, 250, 190].map((v, i) => v + sway(16, 1.0, i * 0.17));
    $("waveA").setAttribute("d",
      `M0 ${y(a[0])}C${x(240)} ${y(a[1])} ${x(480)} ${y(a[2])} ${x(720)} ${y(a[3])}C${x(960)} ${y(a[4])} ${x(1200)} ${y(a[5])} ${x(1440)} ${y(a[6])}V0H0Z`);
    const b = [200, 150, 120, 170, 230, 215, 160].map((v, i) => v + sway(14, 1.5, 0.3 + i * 0.21));
    $("waveB").setAttribute("d",
      `M0 ${y(b[0])}C${x(240)} ${y(b[1])} ${x(520)} ${y(b[2])} ${x(760)} ${y(b[3])}C${x(1000)} ${y(b[4])} ${x(1220)} ${y(b[5])} ${x(1440)} ${y(b[6])}V0H0Z`);
    const c = [120, 60, 40, 95, 150, 125, 70].map((v, i) => v + sway(12, 2.0, 0.6 + i * 0.19));
    $("waveC").setAttribute("d",
      `M0 ${y(c[0])}C${x(260)} ${y(c[1])} ${x(540)} ${y(c[2])} ${x(780)} ${y(c[3])}C${x(1020)} ${y(c[4])} ${x(1240)} ${y(c[5])} ${x(1440)} ${y(c[6])}V0H0Z`);
  }

  function pulse(n, t, a, b) {
    const u = seg(t, a, b);
    const x = mix(X0, TIP, easeOut(u));
    const vis = t < a || t > b ? 0 : Math.min(1, u / 0.08, (1 - u) / 0.10);
    for (const id of ["glow" + n, "dot" + n]) $(id).setAttribute("cx", x);
    $("glow" + n).setAttribute("opacity", 0.22 * vis);
    $("dot" + n).setAttribute("opacity", vis);
  }

  // ---- storyboard (see README.md) -----------------------------------------
  window.render = function (t) {
    // whole clip: waves sway, the dot grid drifts, the unsigned dashes march, the camera pushes in
    waves(t);
    $("gridRect").setAttribute("transform", `translate(${(-t * 120) % 40} ${(-t * 80) % 40})`);
    $("edgeDash").setAttribute("stroke-dashoffset", -t * 150);
    const zoom = mix(0.94, 1, smooth(seg(t, 0.16, 0.40))) + 0.03 * smooth(seg(t, 0.60, 1));
    $("cam").style.transform = `scale(${zoom})`;

    // 0.30–0.42  edge draws solid from Claude to GPT
    const draw = smooth(seg(t, 0.30, 0.42));
    $("edgeSolid").setAttribute("x2", mix(X0, X1, draw));
    $("edgeDash").setAttribute("x1", mix(X0, X1, draw));
    $("edgeDash").setAttribute("opacity", draw >= 1 ? 0 : 1);
    $("arrow").setAttribute("fill", mixColor("#6B665B", "#171512", seg(t, 0.39, 0.42)));

    // 0.42–0.52  a ripple marks the signature
    const r = seg(t, 0.42, 0.52);
    $("ripple").setAttribute("r", mix(6, 84, easeOut(r)));
    $("ripple").setAttribute("opacity", r <= 0 || r >= 1 ? 0 : 0.55 * (1 - r));

    // 0.42–0.50  "work · 30d · signed ✓" tag scales in, with a thin leader to the edge
    const tag = smooth(seg(t, 0.42, 0.50));
    $("tag").style.opacity = tag;
    $("tag").style.transform = `translateX(-50%) scale(${mix(0.96, 1, tag)})`;
    $("leader").setAttribute("opacity", 0.45 * tag);

    // 0.70–0.82 and 0.80–0.92  two pulses travel Claude → GPT (ease-out), fading at the ends
    pulse(1, t, 0.70, 0.82);
    pulse(2, t, 0.80, 0.92);

    // GPT's border flashes amber-strong as each pulse lands, then settles back to ink
    const flash = Math.max(Math.sin(Math.PI * seg(t, 0.80, 0.86)), Math.sin(Math.PI * seg(t, 0.90, 0.96)));
    $("gptBox").setAttribute("stroke", mixColor("#171512", "#A86E00", flash));
    $("gptBox").setAttribute("stroke-width", mix(2.25, 3.4, flash));

    // Therapy Bot is intentionally untouched in every frame (only the camera moves it).
  };

  // ?t=0.5 for quick manual checks in a browser, ?bare=1 for the stills
  const params = new URLSearchParams(location.search);
  if (params.get("bare")) $("scene").classList.add("bare");
  window.render(Number(params.get("t") ?? 0));
</script>
</body>
</html>
