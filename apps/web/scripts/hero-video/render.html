<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hive hero graph — render scene</title>
<!--
  Draws the hero graph (Figma 5:22, 700×226) for any t in 0..1, following the
  storyboard in docs/hero-prompt.md §15. render.mjs calls window.render(f/240)
  for each of the 241 frames and screenshots it at 2× (1400×452).
-->
<style>
  @font-face { font-family:"Fraunces"; src:url(assets/fraunces.woff2) format("woff2"); font-weight:100 900; }
  @font-face { font-family:"JetBrains Mono"; src:url(assets/jbmono-400.woff2) format("woff2"); font-weight:400; }
  @font-face { font-family:"JetBrains Mono"; src:url(assets/jbmono-500.woff2) format("woff2"); font-weight:500; }
  :root{
    --paper:#F4F2EC; --paper-2:#ECE9E1; --ink:#171512; --ink-3:#6B665B;
    --clay:#B7B0A0; --amber-strong:#A86E00;
  }
  html,body{ margin:0; background:var(--paper); }
  #scene{ position:relative; width:700px; height:226px; overflow:hidden; background:var(--paper); }
  svg{ position:absolute; inset:0; }
  .label{ position:absolute; white-space:nowrap; }
  .name{ font:400 19px/23px "Fraunces"; font-variation-settings:"WONK" 1, "SOFT" 0; color:var(--ink); }
  .mono{ font:400 14px/18px "JetBrains Mono"; color:var(--ink-3); }
  .icon{ position:absolute; width:22px; height:22px; }
  #tag{ position:absolute; left:350px; top:84px; transform-origin:50% 0;
        display:flex; align-items:center; gap:8px; padding:5px 10px;
        background:var(--paper-2); border:1px solid var(--amber-strong); border-radius:6px;
        font:500 14px/18px "JetBrains Mono"; color:var(--ink); white-space:nowrap; }
  #tag .tick{ color:var(--amber-strong); }
</style>
</head>
<body>
<div id="scene">
  <svg width="700" height="226" viewBox="0 0 700 226" xmlns="http://www.w3.org/2000/svg">
    <!-- Claude node (Figma: x140 y8 152×64, 1.5 ink stroke inside, 3px amber-strong bar) -->
    <rect x="140.75" y="8.75" width="150.5" height="62.5" fill="#F4F2EC" stroke="#171512" stroke-width="1.5"/>
    <rect x="140" y="8" width="3" height="64" fill="#A86E00"/>
    <!-- GPT node -->
    <rect id="gptBox" x="408.75" y="8.75" width="150.5" height="62.5" fill="#F4F2EC" stroke="#171512" stroke-width="1.5"/>
    <rect x="408" y="8" width="3" height="64" fill="#A86E00"/>
    <!-- Therapy Bot (isolated: paper-2 fill, 1.3 dashed clay 4/4) — never changes -->
    <rect x="140.65" y="128.65" width="168.3" height="62.7" fill="#ECE9E1" stroke="#B7B0A0" stroke-width="1.3" stroke-dasharray="4 4"/>

    <!-- edge: dashed (unsigned) underlay, then solid (signed) overlay drawn left→right -->
    <line id="edgeDash" x1="298" y1="40" x2="392" y2="40" stroke="#6B665B" stroke-width="1.5" stroke-dasharray="5 5"/>
    <line id="edgeSolid" x1="298" y1="40" x2="298" y2="40" stroke="#171512" stroke-width="2"/>
    <path id="arrow" d="M394 35.5 L402 40 L394 44.5 Z" fill="#6B665B"/>

    <!-- leader from edge to tag -->
    <line id="leader" x1="350" y1="44" x2="350" y2="84" stroke="#A86E00" stroke-width="1" opacity="0"/>

    <!-- pulse -->
    <circle id="glow" cx="298" cy="40" r="13" fill="#A86E00" opacity="0"/>
    <circle id="dot"  cx="298" cy="40" r="6"  fill="#A86E00" opacity="0"/>
  </svg>

  <img class="icon" src="assets/claude.png" style="left:169.5px; top:29px" alt="">
  <div class="label name" style="left:202.5px; top:28.5px">Claude</div>

  <img class="icon" src="assets/gpt.png" style="left:448.5px; top:29px" alt="">
  <div class="label name" style="left:481.5px; top:28.5px">GPT</div>

  <div class="label name" style="left:159.3px; top:138px; color:var(--ink-3)">Therapy Bot</div>
  <div class="label mono" style="left:159.3px; top:164px">no edge, no read</div>

  <div id="tag">work&nbsp;&nbsp;·&nbsp;&nbsp;30d&nbsp;&nbsp;·&nbsp;&nbsp;signed <span class="tick">✓</span></div>
</div>

<script>
  // ---- helpers -----------------------------------------------------------
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const smooth = t => t * t * (3 - 2 * t);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);        // 0..1 inside [a,b]
  const mix = (a, b, k) => a + (b - a) * k;
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mixColor = (a, b, k) => {
    const A = hex(a), B = hex(b);
    return "#" + A.map((v, i) => Math.round(mix(v, B[i], k)).toString(16).padStart(2, "0")).join("");
  };

  const $ = id => document.getElementById(id);
  const X0 = 298, X1 = 392, TIP = 402, Y = 40;

  // ---- storyboard (docs/hero-prompt.md §15) -------------------------------
  window.render = function (t) {
    // 0.30–0.42  edge draws solid from Claude to GPT
    const draw = smooth(seg(t, 0.30, 0.42));
    $("edgeSolid").setAttribute("x2", mix(X0, X1, draw));
    $("edgeDash").setAttribute("x1", mix(X0, X1, draw));
    $("edgeDash").setAttribute("opacity", draw >= 1 ? 0 : 1);
    $("arrow").setAttribute("fill", mixColor("#6B665B", "#171512", seg(t, 0.39, 0.42)));

    // 0.42–0.50  "work · 30d · signed ✓" tag scales in, with a thin leader to the edge
    const tag = smooth(seg(t, 0.42, 0.50));
    $("tag").style.opacity = tag;
    $("tag").style.transform = `translateX(-50%) scale(${mix(0.96, 1, tag)})`;
    $("leader").setAttribute("opacity", 0.45 * tag);

    // 0.72–0.86  pulse travels Claude → GPT (ease-out), fading in and out at the ends
    const u = seg(t, 0.72, 0.86);
    const x = mix(X0, TIP, easeOut(u));
    const vis = t < 0.72 || t > 0.86 ? 0 : Math.min(1, u / 0.08, (1 - u) / 0.10);
    for (const id of ["glow", "dot"]) $(id).setAttribute("cx", x);
    $("glow").setAttribute("opacity", 0.22 * vis);
    $("dot").setAttribute("opacity", vis);

    // 0.84–0.90  GPT's border flashes amber-strong once, then settles back to ink
    const f = seg(t, 0.84, 0.90);
    const flash = Math.sin(Math.PI * f);
    $("gptBox").setAttribute("stroke", mixColor("#171512", "#A86E00", flash));
    $("gptBox").setAttribute("stroke-width", mix(1.5, 2.25, flash));

    // Therapy Bot is intentionally untouched in every frame.
  };

  // ?t=0.5 for quick manual checks in a browser
  const q = new URLSearchParams(location.search).get("t");
  window.render(q === null ? 0 : Number(q));
</script>
</body>
</html>
