[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# Monad execution environment (Foundry >= 1.8.0)
network = "monad"
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
# Verify on Monad (Sourcify via MonadVision needs no API key):
#   forge verify-contract <addr> <name> --chain 10143 --verifier sourcify --verifier-url https://sourcify-api-monad.blockvision.org/

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
